name: Generate Space Shooter Animation

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches:
    - main

# ADD THIS: Grants the action permission to push the generated files to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Updated to the newest version

      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/space-shooter.svg
            dist/space-shooter-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}