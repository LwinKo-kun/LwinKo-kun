name: Generate GitHub Assets

on:
  schedule:
    - cron: "0 0 * * *" # Updates automatically every day
  workflow_dispatch: # Allows manual execution
  push:
    branches:
      - main

# Grants permission to push the generated files to your repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Create a folder to hold all the images
      - name: Create dist directory
        run: mkdir -p dist

      # 1. Generate Space Shooter
      - name: Generate Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/space-shooter.svg
            dist/space-shooter-dark.svg?palette=github-dark

      # 2. Generate Contribution Snake
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 3. Generate Activity Graph (Downloads safely in the background)
      - name: Download Activity Graph
        run: |
          curl -o dist/activity-graph.svg --retry 3 "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&bg_color=1a1b27&color=38bdf8&line=38bdf8&point=ffffff&hide_border=true&area=true"

      # 4. Push EVERYTHING to the output branch at once
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}